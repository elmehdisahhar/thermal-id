[project]
name = "thermal-id"
version = "0.1.0"
description = "Identification des indicateurs thermiques d'un bâtiment (HLC, Hb, tau) à partir de T_int(t) et U(t)"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]
